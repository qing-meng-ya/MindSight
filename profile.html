<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 | MindSight 法医助手</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        :root {
            --bg-0: #04070c;
            --bg-1: #0d1a2b;
            --panel: #111f31;
            --panel-strong: #16263d;
            --line: rgba(255, 255, 255, 0.14);
            --text-main: #ecf3ff;
            --text-muted: #9fb0c8;
            --accent: #40d8c5;
            --accent-2: #ffb454;
        }

        [data-theme="light"] {
            --bg-0: #f5f7fa;
            --bg-1: #e8ecf2;
            --panel: #ffffff;
            --panel-strong: #f0f2f5;
            --line: rgba(0, 0, 0, 0.12);
            --text-main: #1a2332;
            --text-muted: #5a6a7e;
        }

        body {
            background: var(--bg-0);
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .top-nav {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .profile-page {
            display: grid;
            gap: 28px;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: rgba(64, 216, 197, 0.15);
        }

        .toggle-switch {
            width: 40px;
            height: 22px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 11px;
            position: relative;
            transition: background 0.3s ease;
        }

        .toggle-switch::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--text-main);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s ease;
        }

        [data-theme="light"] .toggle-switch {
            background: var(--accent);
        }

        [data-theme="light"] .toggle-switch::after {
            transform: translateX(18px);
            background: #fff;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .kpi {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
        }

        [data-theme="light"] .kpi {
            background: rgba(0, 0, 0, 0.03);
        }

        .list-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--line);
        }

        [data-theme="light"] .list-item {
            background: rgba(0, 0, 0, 0.03);
        }

        .field input,
        .field select,
        .field textarea {
            background: var(--bg-0);
            border: 1px solid var(--line);
            color: var(--text-main);
        }

        .site-footer {
            border-top: 1px solid var(--line);
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">MindSight 法医助手</a>
            <button class="mobile-toggle" type="button">菜单</button>
            <nav class="nav-links" data-open="false">
                <a href="index.html">首页</a>
                <a href="login.html">登录</a>
                <a href="register.html">注册</a>
                <a href="profile.html" class="active">个人中心</a>
            </nav>
        </div>
    </header>

    <main class="page profile-page">
        <section class="hero">
            <article class="panel reveal">
                <p class="section-note">个人工作台</p>
                <h1 class="gradient-title">个人中心</h1>
                <p class="subtitle">集中查看个人资料、业务记录与设置选项</p>
                <div class="profile-summary">
                    <div class="profile-avatar" id="profileAvatar">访</div>
                    <div>
                        <h2 class="profile-name" id="profileName">访客</h2>
                        <p class="helper" id="profileRole">未登录</p>
                        <p class="helper" id="profileEmail"></p>
                        <p class="helper" id="profileContact"></p>
                    </div>
                </div>
                <p class="helper" id="profileLoginHint">请先登录后查看个人数据。</p>
            </article>
            <aside class="panel reveal">
                <h2 class="form-title">我的数据概览</h2>
                <div class="kpi-grid">
                    <div class="kpi">
                        <span class="label">咨询记录</span>
                        <span class="value" id="profileConsultCount">0</span>
                    </div>
                    <div class="kpi">
                        <span class="label">鉴定申请</span>
                        <span class="value" id="profileAppraisalCount">0</span>
                    </div>
                    <div class="kpi">
                        <span class="label">采购订单</span>
                        <span class="value" id="profileOrderCount">0</span>
                    </div>
                </div>
                <div class="kpi" style="margin-top: 12px;">
                    <span class="label">论坛帖子</span>
                    <span class="value" id="profilePostCount">0</span>
                </div>
            </aside>
        </section>

        <section class="section profile-grid">
            <div class="profile-column">
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">个人资料</h2>
                        <span class="section-note">可编辑</span>
                    </div>
                    <form class="form" id="profileForm">
                        <div class="field">
                            <label for="profileNameInput">姓名</label>
                            <input id="profileNameInput" type="text" placeholder="请输入姓名" required>
                        </div>
                        <div class="field">
                            <label for="profileEmailInput">邮箱</label>
                            <input id="profileEmailInput" type="email" placeholder="请输入邮箱" required>
                        </div>
                        <div class="field">
                            <label for="profileContactInput">联系方式</label>
                            <input id="profileContactInput" type="text" placeholder="手机号或其他联系方式">
                        </div>
                        <p class="helper" id="profileFormHint">保存后将同步更新本地账号信息。</p>
                        <button class="btn btn-primary btn-block" type="submit" id="profileSaveBtn">保存修改</button>
                    </form>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">界面设置</h2>
                        <span class="section-note">偏好设置</span>
                    </div>
                    <div class="list">
                        <div class="list-item">
                            <h4>主题模式</h4>
                            <p>切换深色与浅色界面风格</p>
                            <div style="margin-top: 12px;">
                                <button class="theme-toggle" id="themeToggle">
                                    <span id="themeLabel">深色模式</span>
                                    <div class="toggle-switch"></div>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">账号安全</h2>
                        <span class="section-note">演示版只读</span>
                    </div>
                    <div class="list" id="profileSecurityList"></div>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">通知 / 消息</h2>
                        <span class="section-note" id="profileNoticeNote">暂无消息</span>
                    </div>
                    <div class="list" id="profileNoticeList"></div>
                </article>
            </div>
            <div class="profile-column">
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">我的咨询</h2>
                        <span class="section-note" id="profileConsultNote">按账号隔离</span>
                    </div>
                    <div class="list" id="profileConsultList"></div>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">我的鉴定</h2>
                        <span class="section-note" id="profileAppraisalNote">按账号隔离</span>
                    </div>
                    <div class="list" id="profileAppraisalList"></div>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">我的订单</h2>
                        <span class="section-note" id="profileOrderNote">按账号隔离</span>
                    </div>
                    <div class="list" id="profileOrderList"></div>
                </article>
                <article class="panel reveal">
                    <div class="section-head">
                        <h2 class="section-title">我的帖子</h2>
                        <span class="section-note" id="profilePostNote">按账号隔离</span>
                    </div>
                    <div class="list" id="profilePostList"></div>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span data-year></span> MindSight 法医助手</p>
    </footer>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/profile.js"></script>
    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const themeLabel = document.getElementById('themeLabel');
            
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                themeLabel.textContent = theme === 'dark' ? '深色模式' : '浅色模式';
            }
            
            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const next = current === 'dark' ? 'light' : 'dark';
                applyTheme(next);
            }
            
            themeToggle.addEventListener('click', toggleTheme);
            
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        })();
    </script>
</body>
</html>
