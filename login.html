<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | MindSight 法医助手</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">MindSight 法医助手</a>
            <button class="mobile-toggle" type="button">菜单</button>
            <nav class="nav-links" data-open="false">
                <a href="index.html">首页</a>
                <a href="login.html" class="active">登录</a>
                <a href="register.html">注册</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <section class="split">
            <article class="form-card reveal">
                <h1 class="form-title">登录账号</h1>
                <p class="subtitle">登录后可使用咨询预约、鉴定提交、发帖和采购结算。</p>
                <p class="helper" id="authHint"></p>
                <form class="form" id="loginForm">
                    <div class="field">
                        <label for="loginEmail">邮箱</label>
                        <input id="loginEmail" name="email" type="email" placeholder="请输入注册邮箱" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">密码</label>
                        <input id="loginPassword" name="password" type="password" placeholder="请输入密码" required>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">立即登录</button>
                </form>
                <p class="helper">还没有账号？<a class="highlight" href="register.html">去注册</a></p>
            </article>

            <aside class="panel reveal">
                <h2 class="form-title">登录后你可以做什么</h2>
                <div class="list">
                    <div class="list-item">
                        <h4>在线咨询预约</h4>
                        <p>按时段提交咨询请求，查看待确认/已完成状态。</p>
                    </div>
                    <div class="list-item">
                        <h4>伤情鉴定申请</h4>
                        <p>提交案件信息并自动估算费用和周期，形成申请单。</p>
                    </div>
                    <div class="list-item">
                        <h4>工具使用与学习</h4>
                        <p>使用各类法医计算工具，学习专业知识。</p>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span data-year></span> MindSight 法医助手</p>
    </footer>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
